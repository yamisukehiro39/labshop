services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: awslab
      POSTGRES_USER: labadmin
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labadmin -d awslab"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["python", "-m", "scripts.migrate"]
    environment:
      DATABASE_URL: postgresql://labadmin:local-demo-only@db:5432/awslab
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://labadmin:local-demo-only@db:5432/awslab
      LAB_MODE: ${LAB_MODE:-secure}
      COOKIE_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./scripts/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
volumes:
  database:
